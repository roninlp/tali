name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push supersedes the previous run on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep boundary/service tests on one host zone in CI. Vite Task passes TZ
  # through to every task, cached or not.
  TZ: UTC

jobs:
  test:
    name: Typecheck, lint, format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite Task fingerprints task inputs itself; the Actions key only selects
      # which saved task cache to restore. Restore after install so pnpm cannot
      # replace the directory. The pnpm store is cached by setup-node above.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm typecheck

      - run: pnpm quality

      - run: pnpm build

      # Unit + SQL integration (fake-d1) + the workerd boundary suite.
      - run: pnpm test

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
