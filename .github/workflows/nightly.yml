name: Nightly

# The bounded suites run on every PR. This is the longer run that explores
# many more two-device interleavings (ticket #83; the nightly E2E gate flows
# from ticket #84 join this workflow).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  TZ: UTC

jobs:
  conflict-lab:
    name: Conflict lab (long randomised run)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @tali/conflict-lab test:nightly
