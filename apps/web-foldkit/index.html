<!doctype html>
<html lang="fa" dir="rtl" data-theme="tali">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tali</title>
    <meta name="description" content="تالی — برنامه‌ریز شخصی و خانوادگی" />
    <meta name="theme-color" content="#f6f6f7" />
    <!-- Apply the saved daisyUI theme before first paint: the app is
         client-rendered, so without this the shell would flash the default
         light palette even when a dark theme is saved. -->
    <script src="/theme-boot.js"></script>
    <!-- Installable PWA shell: the manifest + service worker are what let a
         Web Push subscription survive the page. On :3001 this is a separate
         origin from the legacy app, so its registration is independent. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="تالی" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff'%3E%D8%AA%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link href="/src/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
